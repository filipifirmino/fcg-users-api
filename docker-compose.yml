services:
  users-postgres:
    image: postgres:16-alpine
    container_name: fcg_users_postgres
    environment:
      POSTGRES_USER: postgree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: fcg_users
    ports:
      - "5433:5432"
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgree -d fcg_users"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fcg_users_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  users-api:
    build: .
    container_name: fcg_users_api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: "Host=users-postgres;Port=5432;Database=fcg_users;Username=postgree;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      Jwt__SecretKey: ${JWT_SECRET:?defina JWT_SECRET no .env}
      Jwt__Issuer: "FCG.Api"
      Jwt__Audience: "FCG.Client"
      Jwt__ExpirationMinutes: "60"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      users-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  users_postgres_data:
